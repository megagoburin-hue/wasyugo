<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>検索結果</title>
  <link rel="stylesheet" href="result_style.css" />
</head>
<body>
  <!-- ヘッダー -->
  <header class="app-header">
    <div class="logo-balloon">わしゅごー！</div>
  </header>

  <main class="app-main">
    <div class="white-container">
      <h1 class="kensaku">検索結果</h1>

      <!-- 切替ボタン -->
      <div class="button-container">
        <button id="showResultsBtn" class="switch-btn active">🔍 検索結果</button>
        <button id="showBookmarksBtn" class="switch-btn">🧡 お気に入り一覧</button>
      </div>

      <!-- 中間駅などの情報表示 -->
      <div class="info" id="info"></div>

      <!-- フィルター -->
      <div class="filter-container">
        <label for="genreFilter" class="janru">飲食店をジャンルで絞り込み：</label>
        <select id="genreFilter">
          <option value="すべて">すべて表示</option>
          <option value="居酒屋">居酒屋</option>
          <option value="和食">和食</option>
          <option value="洋食">洋食</option>
          <option value="イタリアン・フレンチ">イタリアン・フレンチ</option>
          <option value="中華">中華</option>
          <option value="ラーメン">ラーメン</option>
          <option value="カフェ">カフェ・スイーツ</option>
          <option value="ダイニングバー・バル">ダイニングバー・バル</option>
          <option value="創作料理">創作料理</option>
          <option value="焼肉・ホルモン">焼肉・ホルモン</option>
          <option value="韓国料理">韓国料理</option>
          <option value="アジア・エスニック料理">アジア・エスニック料理</option>
          <option value="各国料理">各国料理</option>
          <option value="バー・カクテル">バー・カクテル</option>
          <option value="お好み焼き・もんじゃ">お好み焼き・もんじゃ</option>
        </select>
      </div>

      <!-- 件数表示 -->
      <div id="matchCount">中間駅周辺を検索中...</div>

      <!-- メインコンテンツ -->
      <div class="main-container">
        <!-- 左：飲食店リスト -->
        <ul id="resultsList"></ul>

        <!-- 右：地図 -->
        <div id="map"></div>
      </div>

      <!-- シェアボタン -->
      <div class="share-container">
        <button id="webShareButton" class="share-button">このページをシェアする</button>
      </div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="app-footer">
    <a href="riyoukiyaku.html">利用規約</a>
    <a href="policy.html">プライバシーポリシー</a>
  </footer>

  <script src="config.js"></script>
  <script src="result.js"></script> 
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD0f2YUh5K1CuRNVTyXYmOXRxNxKY-CWz0&loading=async&libraries=places&v=weekly&callback=initMap">
  </script>
</body>
</html>
