<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>お気に入り店舗一覧</title>
  <link rel="stylesheet" href="toppage_style.css" />
  
  <style>
    
    #bookmarkList {
      max-width: 600px;
      margin: 20px auto 0 auto; /* 中央寄せ */
      padding: 0;
      list-style: none;
      border: 1px solid #ffe3a8; /* 外枠の線をサイトのトーンに合わせる */
      border-radius: 16px;       /* 角の丸みを統一 */
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    
    /* 1店舗ずつのカードのデザイン */
    #bookmarkList li {
      cursor: pointer;
      padding: 16px;
      display: flex;
      border-bottom: 1px solid #ffe3a8;
      background: #fff;
      transition: background 0.2s;
    }
    #bookmarkList li:last-child {
      border-bottom: none;
    }
    #bookmarkList li:hover {
      background: #fffbf0; 
    }
    
    /* 写真とテキストの見た目 */
    .shop-img { width: 100px; height: 100px; object-fit: cover; margin-right: 16px; border-radius: 8px; }
    .shop-info { display: flex; flex-direction: column; justify-content: center; text-align: left; }
    .shop-genre { background: #ffc22f; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 10px; width: fit-content; margin-bottom: 6px; font-weight: bold; }
    .shop-name { font-weight: bold; font-size: 16px; color: #f58b05; text-decoration: underline; margin: 2px 0; }
    .shop-sub { font-size: 12px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="logo-balloon">わしゅごー！</div>
  </header>

  <main class="app-main">
    <div class="white-container">
      <h2>🧡 あなたのお気に入り店舗一覧</h2>
      <ul id="bookmarkList"></ul>
    </div>
  </main>

  <!--フッター -->
  <footer class="app-footer">
    <a href="riyoukiyaku.html">利用規約</a>
    <a href="policy.html">プライバシーポリシー</a>
  </footer>

  <script>
    // ページが開いた瞬間に自動でお気に入りを集めて表示する
    document.addEventListener("DOMContentLoaded", () => {
      const ul = document.getElementById("bookmarkList");
      
      // localStorageからデータを取得
      const savedBookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];
      
      // 0件だった場合
      if (savedBookmarks.length === 0) {
        ul.innerHTML = "<li style='cursor:default; color:#999; justify-content:center; padding:40px;'>お気に入りは登録されていません</li>";
        return;
      }
      
      savedBookmarks.forEach(shop => {
        const li = document.createElement("li");
        
        li.innerHTML = `
          <img src="${shop.photo.pc.m}" class="shop-img">
          <div class="shop-info">
            <div class="shop-genre">${shop.genre.name}</div>
            <div class="shop-name">${shop.name}</div>
            <div class="shop-sub">📍 ${shop.access}</div>
            <div class="shop-sub">📅 定休日: ${shop.close || 'データなし'}</div>
          </div>
        `;
        
        // クリックしたらホットペッパーのページを別タブで開く
        li.addEventListener("click", () => {
          const hotpepperUrl = `https://www.hotpepper.jp/str${shop.id}/`;
          window.open(hotpepperUrl, "_blank");
        });
        
        ul.appendChild(li);
      });
    });
  </script>
</body>
</html>
